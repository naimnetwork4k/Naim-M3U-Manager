name: Build Naim M3U Manager Tools APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android App Icons
        run: |
          ICON_SOURCE=""
          for candidate in "assets/icon.png" "www/icon.png" "icon.png" "assets/logo.png" "www/logo.png" "logo.png"; do
            if [ -f "$candidate" ]; then
              ICON_SOURCE="$candidate"
              break
            fi
          done

          if [ -z "$ICON_SOURCE" ]; then
            FOUND_LOGO=$(find . -maxdepth 3 -iname "*logo*.png" -o -iname "*icon*.png" 2>/dev/null | grep -v "./android" | grep -v "./node_modules" | head -n 1)
            if [ -n "$FOUND_LOGO" ]; then
              ICON_SOURCE="$FOUND_LOGO"
            fi
          fi

          if [ -n "$ICON_SOURCE" ]; then
            mkdir -p assets
            cp "$ICON_SOURCE" "assets/icon.png" 2>/dev/null || true
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000' || true
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp "$ICON_SOURCE" "$dir/ic_launcher.png" 2>/dev/null || true
                cp "$ICON_SOURCE" "$dir/ic_launcher_round.png" 2>/dev/null || true
                cp "$ICON_SOURCE" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          fi

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naim-M3U-Manager-Tools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
