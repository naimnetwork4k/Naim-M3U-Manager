name: Build Naim M3U Manager Tools APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build || true

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android || true

      - name: Apply custom icon safely without duplicate resources
        run: |
          set +e
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.png 2>/dev/null || true

          ICON_SRC=""
          for f in "icon.png" "logo.png" "1000273307 (1).png" "assets/icon.png" "assets/logo.png" "www/icon.png" "www/logo.png"; do
            if [ -f "$f" ]; then
              ICON_SRC="$f"
              break
            fi
          done

          if [ -n "$ICON_SRC" ] && [ -f "$ICON_SRC" ]; then
            echo "Using icon: $ICON_SRC"
            for dir in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                cp -f "$ICON_SRC" "$dir/ic_launcher.png" 2>/dev/null || true
                cp -f "$ICON_SRC" "$dir/ic_launcher_round.png" 2>/dev/null || true
                cp -f "$ICON_SRC" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          else
            echo "No icon file found in standard paths"
          fi
          exit 0

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Naim-M3U-Manager-Tools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
