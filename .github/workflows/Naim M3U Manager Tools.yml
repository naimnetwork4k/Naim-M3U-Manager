name: Build Naim M3U Manager Tools APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build || true

      - name: Sync Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android || true

      - name: Apply custom app icon
        run: |
          ICON_PATH=""
          for candidate in "icon.png" "logo.png" "assets/icon.png" "assets/logo.png" "www/icon.png" "www/logo.png"; do
            if [ -f "$candidate" ]; then
              ICON_PATH="$candidate"
              break
            fi
          done

          if [ -n "$ICON_PATH" ]; then
            for mip in android/app/src/main/res/mipmap-*; do
              if [ -d "$mip" ]; then
                cp -f "$ICON_PATH" "$mip/ic_launcher.png" 2>/dev/null || true
                cp -f "$ICON_PATH" "$mip/ic_launcher_round.png" 2>/dev/null || true
                cp -f "$ICON_PATH" "$mip/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          fi

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Naim-M3U-Manager-Tools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
