name: Build Naim M3U Manager Tools APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build || true

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply custom app icon safely
        run: |
          ICON_FILE=""
          for path in "assets/icon.png" "www/icon.png" "icon.png" "assets/logo.png" "www/logo.png" "logo.png"; do
            if [ -f "$path" ]; then
              ICON_FILE="$path"
              break
            fi
          done

          if [ -z "$ICON_FILE" ]; then
            ICON_FILE=$(find . -maxdepth 4 -type f \( -iname "*logo*.png" -o -iname "*icon*.png" \) 2>/dev/null | grep -v "./android" | grep -v "./node_modules" | head -n 1 || true)
          fi

          if [ -n "$ICON_FILE" ] && [ -f "$ICON_FILE" ]; then
            mkdir -p assets
            cp "$ICON_FILE" "assets/icon.png" 2>/dev/null || true
            if npx --no-install capacitor-assets --version >/dev/null 2>&1; then
              npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000' || true
            fi
            for mipdir in android/app/src/main/res/mipmap-*; do
              if [ -d "$mipdir" ]; then
                cp "$ICON_FILE" "$mipdir/ic_launcher.png" 2>/dev/null || true
                cp "$ICON_FILE" "$mipdir/ic_launcher_round.png" 2>/dev/null || true
                cp "$ICON_FILE" "$mipdir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          fi

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Naim-M3U-Manager-Tools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
