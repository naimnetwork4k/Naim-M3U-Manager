name: Build Android APK with Custom Logo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies & Initialize Capacitor
        run: |
          npm install
          # capacitor.config.json already defines appId, appName and webDir.
          npx cap add android

      - name: Add Native Android Media3 Player
        run: |
          PKG_DIR=android/app/src/main/java/com/naim/livetvhd
          mkdir -p "$PKG_DIR"
          cp native/android/NativeVideoPlayerPlugin.java "$PKG_DIR/"
          cp native/android/NativePlayerActivity.java "$PKG_DIR/"

          # Register the Capacitor plugin in the generated MainActivity.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/naim/livetvhd/MainActivity.java")
          if not p.exists():
              candidates = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
              if len(candidates) != 1:
                  raise SystemExit("Capacitor MainActivity.java was not found uniquely; native player registration stopped")
              p = candidates[0]
          s = p.read_text()
          if "NativeVideoPlayerPlugin.class" not in s:
              s = s.replace("public class MainActivity extends BridgeActivity {",
                            "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(NativeVideoPlayerPlugin.class);\n        super.onCreate(savedInstanceState);\n    }")
          p.write_text(s)
          # Register the native fullscreen player activity.
          m = Path("android/app/src/main/AndroidManifest.xml")
          xml = m.read_text()
          activity = '<activity android:name=".NativePlayerActivity" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="false" android:screenOrientation="unspecified" />'
          if "NativePlayerActivity" not in xml:
              xml = xml.replace("</application>", "        " + activity + "\n    </application>")
          m.write_text(xml)
          PY

          # Media3: native ExoPlayer with HLS, DASH, TS/progressive playback and UI controls.
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              def media3Version = "1.4.1"
              implementation "androidx.media3:media3-exoplayer:$media3Version"
              implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
              implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
              implementation "androidx.media3:media3-exoplayer-rtsp:$media3Version"
              implementation "androidx.media3:media3-ui:$media3Version"
          }
          GRADLE

      - name: Setup Splash Screen and Icons
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          # Convert the supplied JPG logo to a real PNG; do not rename JPEG bytes as PNG.
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path("www/icon.png")
          if not src.exists():
              src = Path("www/icon.jpg")
          if not src.exists():
              raise SystemExit("www/icon.png or www/icon.jpg logo is missing")
          Image.open(src).convert("RGBA").save("naim-app-icon.png")
          PY

          mkdir -p android/app/src/main/res/drawable
          cp naim-app-icon.png android/app/src/main/res/drawable/splash.png
          for sz in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$sz
            cp naim-app-icon.png android/app/src/main/res/mipmap-$sz/ic_launcher.png
            cp naim-app-icon.png android/app/src/main/res/mipmap-$sz/ic_launcher_round.png
          done

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naim-LiveTVHD-Large-Splash
          path: android/app/build/outputs/apk/debug/app-debug.apk
